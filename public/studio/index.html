<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #050507; font-family: 'Courier New', monospace; }
#stage { position: absolute; inset: 0 350px 0 0; display: flex; align-items: center; justify-content: center; }
canvas { max-width: 100%; max-height: 100%; }
#panel { position: absolute; top: 0; right: 0; bottom: 0; width: 350px; background: rgba(10,10,14,0.96); border-left: 1px solid #26263a; overflow-y: auto; padding: 12px 14px 96px; color: #b9b9c9; scrollbar-width: thin; }
h1 { font-size: 13px; letter-spacing: 3px; color: #8f7fff; margin-bottom: 8px; }
.group { border: 1px solid #20202e; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
.gtitle { font-size: 10px; letter-spacing: 2px; color: #6a6a88; text-transform: uppercase; cursor: pointer; user-select: none; }
.row { display: flex; align-items: center; justify-content: space-between; margin: 5px 0; gap: 8px; }
.row label { font-size: 11px; color: #9a9ab0; flex: 0 0 96px; }
.row input[type=range] { flex: 1; accent-color: #8f7fff; height: 14px; }
.row .val { font-size: 10px; color: #6a6a88; width: 32px; text-align: right; }
.row select, .row input[type=text] { flex: 1; background: #16161f; color: #c9c9dd; border: 1px solid #2a2a3a; border-radius: 4px; font-family: inherit; font-size: 11px; padding: 3px; }
.row input[type=color] { width: 40px; height: 20px; border: none; background: none; }
.row input[type=checkbox] { accent-color: #8f7fff; }
#presets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
#presets button { background: #191926; color: #a9a9c5; border: 1px solid #2c2c40; border-radius: 4px; font-family: inherit; font-size: 10px; padding: 4px 7px; cursor: pointer; }
#presets button:hover { background: #2a2a44; color: #fff; }
#actions { position: sticky; bottom: 0; background: rgba(10,10,14,0.97); padding: 8px 0 4px; display: flex; gap: 6px; flex-wrap: wrap; }
#actions button { flex: 1 1 46%; background: #26264a; color: #cfcfe6; border: 1px solid #3d3d6a; border-radius: 6px; font-family: inherit; font-size: 10px; padding: 7px 2px; cursor: pointer; letter-spacing: 1px; }
#actions button:hover { background: #38386a; }
#actions button.gold { background: #3d2f10; border-color: #8a6a20; color: #ffd166; }
#loadjson { display: none; }
</style>
</head>

  <div id="actions">

    let [cr, cg, cb] = cellColor(r, g, b, L);
    if (P.bloom > 0 && L > 200) { ctx.shadowColor = `rgba(${cr|0},${cg|0},${cb|0},0.9)`; ctx.shadowBlur = P.bloom; } else ctx.shadowBlur = 0;
    ctx.fillStyle = `rgb(${Math.max(0,Math.min(255,cr))|0},${Math.max(0,Math.min(255,cg))|0},${Math.max(0,Math.min(255,cb))|0})`;
    const jx = jit ? (Math.random()-0.5)*jit : 0, jy = jit ? (Math.random()-0.5)*jit : 0;
    ctx.fillText(ch, x*fw + jx, y*fh + jy);
  }

  if (eng === 'pixel') {
    // half-block photographic: 2 sub-rows per cell, ▀ with fg=top, bg=bottom
    bufHi.width = cols; bufHi.height = rows*2;
    bctxHi.drawImage(video, 0, 0, cols, rows*2);
    const hp = bctxHi.getImageData(0, 0, cols, rows*2).data;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const pT = ((y*2)*cols + x)*4, pB = ((y*2+1)*cols + x)*4;
      const LT = (0.299*hp[pT]+0.587*hp[pT+1]+0.114*hp[pT+2]);
      const LB = (0.299*hp[pB]+0.587*hp[pB+1]+0.114*hp[pB+2]);
      const [tr,tg,tb] = cellColor(hp[pT], hp[pT+1], hp[pT+2], LT);
      const [br,bg2,bb] = cellColor(hp[pB], hp[pB+1], hp[pB+2], LB);
      ctx.fillStyle = `rgb(${br|0},${bg2|0},${bb|0})`;
      ctx.fillRect(x*fw, y*fh, fw, fh);
      ctx.fillStyle = `rgb(${tr|0},${tg|0},${tb|0})`;
      ctx.fillRect(x*fw, y*fh, fw, fh/2);
    }
  } else if (eng === 'braille') {
    // pure dot image: 2x4 subpixels per cell, full-res buffer
    bufHi.width = cols*2; bufHi.height = rows*4;
    bctxHi.drawImage(video, 0, 0, cols*2, rows*4);
    const bp = bctxHi.getImageData(0, 0, cols*2, rows*4).data;
    const gain = P.dotGain/100;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      let dots = 0, sr = 0, sg = 0, sb = 0;
      for (let d = 0; d < 8; d++) {
        const sxp = Math.min(cols*2-1, x*2 + BX[d]), syp = Math.min(rows*4-1, y*4 + BY[d]);
        const p = (syp*(cols*2) + sxp)*4;
        const v = 0.299*bp[p]+0.587*bp[p+1]+0.114*bp[p+2];
        if (v > 255*(1-gain) || (v > 128 && Math.random() < gain)) dots |= BMAP[d];
        sr += bp[p]; sg += bp[p+1]; sb += bp[p+2];
      }
      if (dots) emit(x, y, String.fromCharCode(0x2800+dots), sr/8, sg/8, sb/8, (sr+sg+sb)/24);
    }
  } else if (eng === 'halftone') {
    const gain = P.dotGain/100;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const i = y*cols+x, p = i*4, L = lum[i];
      const rad = (L/255) * Math.min(fw, fh) * 0.62 * gain;
      if (rad < 0.4) continue;
      let [cr,cg,cb] = cellColor(px[p], px[p+1], px[p+2], L);
      ctx.fillStyle = `rgb(${cr|0},${cg|0},${cb|0})`;
      ctx.beginPath();
      ctx.arc(x*fw + fw/2, y*fh + fh/2, rad, 0, Math.PI*2);
      ctx.fill();
    }
  } else if (eng === 'match') {
    const sigs = glyphSigs(ramp);
    const cw = 4, chh = 6;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const i = y*cols+x, p = i*4, L = lum[i];
      const mean = L;
      let best = 0, bestD = 1e9;
      for (let s = 0; s < sigs.length; s++) {
        let d = 0;
        const bits = sigs[s].bits;
        for (let by2 = 0; by2 < chh; by2++) for (let bx = 0; bx < cw; bx++) {
          const sxp = Math.min(cols-1, x + (bx*2/(cw-1)|0));
          const syp = Math.min(rows-1, y + (by2/(chh-1)|0));
          const v = lum[syp*cols+sxp] > mean ? 1 : 0;
          if (v !== bits[by2*cw+bx]) d++;
        }
        if (d < bestD) { bestD = d; best = s; }
      }
      emit(x, y, sigs[best].ch, px[p], px[p+1], px[p+2], L);
    }
  } else {
    // GLYPH engine — bivariate tone/edge/braille (v2 core)
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y*cols+x, p = i*4;
        const xm = x>0?x-1:x, xp = x<cols-1?x+1:x, ym = y>0?y-1:y, yp = y<rows-1?y+1:y;
        const L = lum[i];
        const g00=lum[ym*cols+xm], g01=lum[ym*cols+x], g02=lum[ym*cols+xp];
        const g10=lum[y*cols+xm], g12=lum[y*cols+xp];
        const g20=lum[yp*cols+xm], g21=lum[yp*cols+x], g22=lum[yp*cols+xp];
        let gxv, gyv;
        if (P.edgeStyle === 'emboss') { gxv = g22-g00; gyv = g20-g02; }
        else if (P.edgeStyle === 'laplace') { gxv = g01+g10+g12+g21-4*L; gyv = 0; }
        else { gxv = (g02+2*g12+g22)-(g00+2*g10+g20); gyv = (g20+2*g21+g22)-(g00+2*g01+g02); }
        const mag = Math.sqrt(gxv*gxv+gyv*gyv)/1020;
        const mean = (g00+g01+g02+g10+g12+g20+g21+g22)/8;
        const varr = ((g00-mean)**2+(g01-mean)**2+(g02-mean)**2+(g10-mean)**2+(g12-mean)**2+(g20-mean)**2+(g21-mean)**2+(g22-mean)**2)/8/4000;
        let ch = null, cr = px[p], cg = px[p+1], cb = px[p+2];
        if (edgeMix > 0 && mag > P.edgeThresh/100) {
          const ang = (Math.atan2(gyv, gxv)*180/Math.PI + 360) % 180;
          let fam = DIRS[0];
          if (ang >= 22.5 && ang < 67.5) fam = DIRS[1];
          else if (ang >= 67.5 && ang < 112.5) fam = DIRS[2];
          else if (ang >= 112.5 && ang < 157.5) fam = DIRS[3];
          ch = fam[Math.min(4, Math.floor(mag*9*(P.edgeGain/8)*(0.5+relief)))];
          const lit = (gxv*lx + gyv*ly)/(mag*1020+1);
          const boost = relief*lit*90;
          if (P.edgeColor === 'white') { cr = cg = cb = 255; }
          else if (P.edgeColor === 'black') { cr = cg = cb = 0; }
          else { cr += boost; cg += boost; cb += boost; }
        } else if (brMix > 0.08 && varr > (1-brMix)*0.4 && mag < 0.12) {
          let dots = 0;
          for (let d = 0; d < 8; d++) {
            const v = lum[Math.min(rows-1, ym+BY[d]*Math.max(1,yp-ym)/3|0)*cols + Math.min(cols-1, x+BX[d])];
            if (v > mean + (0.5-brMix)*40) dots |= BMAP[d];
          }
          ch = dots ? String.fromCharCode(0x2800+dots) : null;
        }
        if (!ch && toneMix > 0.05) {
          const t = Math.max(0, Math.min(0.999, L/255));
          ch = ramp[Math.floor((1-t)*(rl-1))];
          if (ch === ' ') ch = null;
        }
        emit(x, y, ch, cr, cg, cb, L);
      }
    }
  }
  ctx.shadowBlur = 0;

  // glitch: displaced strips
  if (P.glitch > 0 && Math.random() < P.glitch/60) {
    const strips = 1 + (Math.random()*4|0);
    for (let s = 0; s < strips; s++) {
      const gy = Math.random()*cv.height|0, gh = 4 + Math.random()*18, dx = (Math.random()-0.5)*cv.width*0.1*P.glitch/50;
      ctx.drawImage(cv, 0, gy, cv.width, gh, dx, gy, cv.width, gh);
    }
  }
  if (P.scan > 0) {
    ctx.fillStyle = 'rgba(0,0,0,' + (P.scan/140) + ')';
    for (let sy = 0; sy < cv.height; sy += 3) ctx.fillRect(0, sy, cv.width, 1);
  }
  if (P.grain > 0) {
    ctx.globalAlpha = P.grain/500;
    for (let gy2 = 0; gy2 < cv.height; gy2 += 256) for (let gx2 = 0; gx2 < cv.width; gx2 += 256)
      ctx.drawImage(noise, gx2 + (Math.random()*8|0), gy2 + (Math.random()*8|0));
    ctx.globalAlpha = 1;
  }
  if (P.vignette > 0) {
    const vg = ctx.createRadialGradient(cv.width/2, cv.height/2, cv.height*0.35, cv.width/2, cv.height/2, cv.height*0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${P.vignette/110})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, cv.width, cv.height);
  }
}

if (MOCK) {
  const m = document.createElement('canvas'); m.width = 640; m.height = 480;
  const mc = m.getContext('2d'); let t = 0;
  // wrap the video: simplest mock = override video element behavior via proxy object
  const mockVideo = new Proxy(m, {
    get(tg, k) {
      if (k === 'videoWidth') return 640; if (k === 'videoHeight') return 480;
      if (k === 'paused' || k === 'ended') return false;
      return tg[k];
    }
  });
  // loop reads `video` directly — swap it
  Object.defineProperty(window, '__mockCanvas', { value: m });
  (function dm() {
    const w = m.width, h = m.height;
    mc.fillStyle = '#141414'; mc.fillRect(0, 0, w, h);
    const lxp = w/2 + Math.cos(t/40)*w/3, lyp = h/2 + Math.sin(t/40)*h/3;
    const rg = mc.createRadialGradient(lxp, lyp, 10, lxp, lyp, h*0.85);
    rg.addColorStop(0, '#f5eede'); rg.addColorStop(1, '#0a0a0a');
    mc.fillStyle = rg; mc.fillRect(0, 0, w, h);
    const bx = w/2 + Math.sin(t/25)*w/5, by = h/2 + Math.cos(t/17)*h/6;
    const sg = mc.createRadialGradient(bx-30, by-30, 5, bx, by, 90);
    sg.addColorStop(0, '#fff'); sg.addColorStop(0.6, '#9a7a55'); sg.addColorStop(1, '#101010');
    mc.fillStyle = sg; mc.beginPath(); mc.arc(bx, by, 90, 0, Math.PI*2); mc.fill();
    mc.save(); mc.translate(w/2, h/2); mc.rotate(t/90);
    mc.fillStyle = '#e8e8e8'; mc.fillRect(-230, -14, 460, 28);
    mc.rotate(Math.PI/4); mc.fillStyle = '#989898'; mc.fillRect(-270, -10, 540, 20);
    mc.restore();
    for (let cy = 0; cy < 8; cy++) for (let cx = 0; cx < 8; cx++)
      if ((cx + cy + (t>>3)) % 2) { mc.fillStyle = '#d8d8d8'; mc.fillRect(470+cx*16, 300+cy*16, 16, 16); }
    t++;
    requestAnimationFrame(dm);
  })();
  // rebind: replace loop's video reference via closure trick — easiest is reassignment
  window.VIDEOSRC = m;
} else {
  initCamera();
}
</script>
<script>
// rebind loop's video source for mock mode (loop closes over `video`; patch by
// making mock frames draw into the video slot via a shim)
if (MOCK) {
  // swap: loop() checks video.paused/ended/videoWidth — give the real video element
  // a mock feed by piping the mock canvas through captureStream
  const stream = window.__mockCanvas.captureStream(30);
  video.srcObject = stream; video.autoplay = true; video.playsInline = true;
  video.play().then(() => requestAnimationFrame(loop)).catch(() => requestAnimationFrame(loop));
}
</script>
