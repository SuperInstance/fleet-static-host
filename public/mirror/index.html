<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real-Time Spatial ASCII Mirror</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; 
            height: 100%; 
            background-color: #050505; 
            color: #00ff00; 
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* The character matrix canvas */
        canvas {
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
        }
        #ui-panel {
            position: absolute;
            bottom: 20px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid #333;
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 10;
        }
        label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        input[type="range"] { accent-color: #00ff00; background: #222; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="ascii-canvas"></canvas>
    </div>

    <div id="ui-panel">
        <div>
            <label for="resolution">Density: </label>
            <input type="range" id="resolution" min="40" max="150" value="90">
        </div>
        <div>
            <label for="contrast">Contrast Stretch: </label>
            <input type="range" id="contrast" min="10" max="50" value="25">
        </div>
    </div>

    <!-- Core Logic Assembly -->
    <script>
        // MOCK MODE: ?mock=1 replaces the webcam with a synthetic animated scene
        // (gradient, moving bars, bouncing balls, noise) so the render path can be
        // exercised end-to-end without camera permissions.
        const MOCK = new URLSearchParams(location.search).has('mock');
        let video;
        if (MOCK) {
            video = document.createElement('canvas');
            video.width = 640; video.height = 480;
            video.videoWidth = 640; video.videoHeight = 480;
            video.paused = false; video.ended = false;
            const mctx = video.getContext('2d');
            let t = 0;
            function drawMockFrame() {
                const w = video.width, h = video.height;
                const grad = mctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#000000');
                grad.addColorStop(1, '#ffffff');
                mctx.fillStyle = grad;
                mctx.fillRect(0, 0, w, h);
                for (let i = 0; i < 4; i++) {
                    const by = ((t * (2 + i)) % (h + 60)) - 30;
                    mctx.fillStyle = `hsl(${(t * 12 + i * 90) % 360}, 80%, ${25 + i * 12}%)`;
                    mctx.fillRect(0, by, w, 24);
                }
                const bx = w / 2 + Math.sin(t / 20) * (w / 2 - 40);
                const byy = h / 2 + Math.cos(t / 14) * (h / 2 - 40);
                mctx.fillStyle = '#ff4444';
                mctx.beginPath(); mctx.arc(bx, byy, 36, 0, Math.PI * 2); mctx.fill();
                mctx.fillStyle = '#44ff88';
                mctx.beginPath(); mctx.arc(w - bx, h - byy, 22, 0, Math.PI * 2); mctx.fill();
                mctx.fillStyle = 'rgba(128,128,128,0.08)';
                for (let n = 0; n < 40; n++) mctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
                t++;
                requestAnimationFrame(drawMockFrame);
            }
            drawMockFrame();
            requestAnimationFrame(renderLoop);
        } else {
            video = document.createElement('video');
        }
        const bufferCanvas = document.createElement('canvas');
        const bufferCtx = bufferCanvas.getContext('2d', { willReadFrequently: true });
        
        const outputCanvas = document.getElementById('ascii-canvas');
        const outputCtx = outputCanvas.getContext('2d');
        
        const resSlider = document.getElementById('resolution');
        const contrastSlider = document.getElementById('contrast');

        // Test-harness URL params (kept after slider declarations to avoid TDZ)
        {
            const QS = new URLSearchParams(location.search);
            const QRES = parseInt(QS.get('res')); const QCON = parseInt(QS.get('con'));
            if (QRES) resSlider.value = QRES;
            if (QCON) contrastSlider.value = QCON;
        }

        // Depth perception character map (Bolder/denser chars = closer/brighter zones)
        const ASCII_MAP = " .:-=+*#%@@@@@@@@"; 
        const MAP_LEN = ASCII_MAP.length;

        // Initialize webcam streams
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 640 }, 
                        height: { ideal: 480 },
                        facingMode: "user" 
                    }, 
                    audio: false 
                });
                video.srcObject = stream;
                video.autoplay = true;
                video.playsInline = true; // Crucial requirement for iOS/iPad support
                video.addEventListener('playing', () => {
                    requestAnimationFrame(renderLoop);
                });
            } catch (err) {
                console.error("Camera access denied or unavailable:", err);
                alert("Please grant webcam permissions to view the ASCII matrix.");
            }
        }

        function renderLoop() {
            if (video.paused || video.ended) return;

            // Target column matrix size based on slider
            const cols = parseInt(resSlider.value);
            const aspectRatio = (video.videoWidth || video.width) / (video.videoHeight || video.height);
            const rows = Math.floor(cols / aspectRatio);

            // Configure small resolution internal buffer frame
            bufferCanvas.width = cols;
            bufferCanvas.height = rows;
            
            // Mirror frame coordinate boundaries so it behaves like a normal reflective mirror
            bufferCtx.translate(cols, 0);
            bufferCtx.scale(-1, 1);
            bufferCtx.drawImage(video, 0, 0, cols, rows);
            bufferCtx.setTransform(1, 0, 0, 1, 0, 0); // Clear transforms

            // Extract the direct raw pixel byte arrays from our small frame buffer
            const imgData = bufferCtx.getImageData(0, 0, cols, rows);
            const pixels = imgData.data;

            // Calculate precise output screen layout requirements
            const fontHeight = Math.max(6, Math.floor(window.innerHeight / rows));
            const fontWidth = fontHeight * 0.6; // Perfect monospace width ratio

            outputCanvas.width = cols * fontWidth;
            outputCanvas.height = rows * fontHeight;

            // Paint the clear terminal background
            outputCtx.fillStyle = '#050505';
            outputCtx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
            
            // Set up our core terminal matrix fonts
            outputCtx.font = `bold ${fontHeight}px 'Courier New', Courier, monospace`;
            outputCtx.textBaseline = 'top';

            const contrastFactor = parseInt(contrastSlider.value) / 10;

            // Single pass transformation loop
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const idx = (y * cols + x) * 4;
                    const r = pixels[idx];
                    const g = pixels[idx + 1];
                    const b = pixels[idx + 2];

                    // Standard human perception luminance equation
                    let brightness = (0.299 * r + 0.587 * g + 0.114 * b);
                    
                    // Contrast tuning logic to stretch the depth perception boundaries
                    if (contrastFactor !== 1.0) {
                        brightness = ((brightness / 255 - 0.5) * contrastFactor + 0.5) * 255;
                        brightness = Math.max(0, Math.min(255, brightness));
                    }

                    // Map brightness directly to our tracking depth layout character spectrum
                    const charIdx = Math.floor((brightness / 255) * (MAP_LEN - 1));
                    const char = ASCII_MAP[charIdx];

                    // Draw the structural color characters to the active output canvas viewport
                    outputCtx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    outputCtx.fillText(char, x * fontWidth, y * fontHeight);
                }
            }

            // Sync frame loops with the system monitor refresh cycle
            requestAnimationFrame(renderLoop);
        }

        // Initialize engine setup (mock branch handled above; real webcam below)
        if (!MOCK) initCamera();

        // Dynamically recalculate viewport properties on mobile screen rotation shifts
        window.addEventListener('resize', () => {
            if (!video.paused) outputCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
        });
    </script>
</body>
</html>
