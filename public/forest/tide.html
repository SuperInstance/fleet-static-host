<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forest Tide Gauge</title>
<style>
  :root{--bg:#0b0e12;--fg:#c9d4e0;--dim:#5c6a7a;--acc:#4fb3a9;--warn:#d9a441;--bad:#c95d5d;--line:#1c242e;--card:#141b24}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 ui-monospace,Menlo,Consolas,monospace}
  header{padding:2rem 2rem 1rem;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:1.3rem;letter-spacing:.08em}
  h1 span{color:var(--acc)}
  header p{color:var(--dim);margin:.4rem 0 0;max-width:78ch}
  main{padding:1.5rem 2rem 2rem;max-width:1280px;margin:0 auto}
  .controls{display:flex;gap:1rem;margin-bottom:2rem;align-items:center}
  .scale-toggle{display:flex;gap:.5rem}
  .scale-btn{padding:.5rem 1rem;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;border-radius:.2rem;font-size:.9rem}
  .scale-btn.active{background:var(--acc);color:var(--bg);font-weight:bold}
  .banner{border:2px solid var(--bad);border-radius:.4rem;background:rgba(201,93,93,.08);padding:1rem;margin-bottom:2rem;color:var(--bad)}
  .banner .title{font-weight:bold;margin-bottom:.5rem}
  .banner .subtitle{color:var(--fg);font-size:.85rem}
  section{margin-bottom:2.5rem}
  section h2{font-size:.85rem;letter-spacing:.12em;color:var(--dim);margin:0 0 1rem;border-bottom:1px solid var(--line);padding-bottom:.4rem;text-transform:uppercase}
  .chart{margin-bottom:1rem;padding:1rem;background:var(--card);border:1px solid var(--line);border-radius:.4rem}
  .chart svg{display:block;margin:0 auto;max-width:100%}
  .loading{color:var(--dim);padding:2rem;text-align:center}
  .error{color:var(--bad);padding:1rem;background:rgba(201,93,93,.08);border:1px solid var(--bad);border-radius:.4rem;margin-bottom:1rem}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:.5rem 0;font-size:.8rem;letter-spacing:.1em;color:var(--dim);border-bottom:1px solid var(--line)}
  td{padding:.5rem 0;border-bottom:1px solid #243040;font-size:.85rem}
  tr:hover{background:rgba(79,179,169,.04)}
  .bucket{color:var(--acc)}
  .count{text-align:right;font-weight:bold;color:var(--acc)}
  .tooltip{position:absolute;background:rgba(0,0,0,.8);color:var(--acc);padding:.3rem .6rem;border-radius:.2rem;font-size:.75rem;pointer-events:none;display:none}
  .tooltip.visible{display:block}
  footer{padding:2rem;color:var(--dim);font-size:.75rem;border-top:1px solid var(--line);margin-top:3rem}
  footer a{color:var(--acc);text-decoration:none}
  footer a:hover{text-decoration:underline}
  @media (max-width:900px){
    main{padding:1rem}
    .controls{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>
<header>
  <h1>FOREST TIDE <span>·</span> GAUGE</h1>
  <p>Visualize forest walk activity over time. Anomaly detection flags activity surges at 3× the median baseline.</p>
</header>
<main>
  <div class="controls">
    <div class="scale-toggle">
      <button class="scale-btn active" data-scale="24h">24h</button>
      <button class="scale-btn" data-scale="7d">7d</button>
      <button class="scale-btn" data-scale="30d">30d</button>
    </div>
  </div>
  <div id="content">
    <div class="loading">Loading tide data…</div>
  </div>
</main>
<footer>
  Back to <a href="/forest/map.html">the forest map</a> or <a href="/forest/">the search</a>
</footer>

<script>
(function(){
  'use strict';
  const $content=document.getElementById('content');
  let currentScale='24h';

  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  async function loadTide(scale){
    currentScale=scale;
    document.querySelectorAll('.scale-btn').forEach(btn=>{
      btn.classList.toggle('active',btn.dataset.scale===scale);
    });
    try{
      const r=await fetch('/api/forest/tide?scale='+scale);
      const j=await r.json();
      if(!j.ok)throw new Error(j.error||'tide fetch failed');
      renderTide(j);
    }catch(e){
      $content.innerHTML='<div class="error">Failed to load tide: '+esc(e.message)+'</div>';
    }
  }

  function renderTide(data){
    const {scale,median,alarm_threshold,has_alarm,alarm_buckets,buckets}=data;
    let html='';

    // Alarm banner
    if(has_alarm){
      html+='<div class="banner">'+
        '<div class="title">⚠ Storm Surge Detected</div>'+
        '<div class="subtitle">'+alarm_buckets.length+' bucket'+(alarm_buckets.length===1?'':'s')+' exceeded '+alarm_threshold+' walks (3× median of '+median+')</div>'+
        '</div>';
    }

    // Chart
    if(buckets.length>0){
      const counts=buckets.map(b=>b.count);
      const maxCount=Math.max(...counts,1);
      const chartH=250,chartW=800;
      const barW=Math.max(1,Math.floor(chartW/buckets.length));

      let svgHtml='<svg viewBox="0 0 '+chartW+' '+chartH+'" xmlns="http://www.w3.org/2000/svg" style="background:#0b0e12">'+
        '<defs>'+
        '<linearGradient id="tideFill" x1="0%" y1="0%" x2="0%" y2="100%">'+
        '<stop offset="0%" style="stop-color:#4fb3a9;stop-opacity:0.4"/>'+
        '<stop offset="100%" style="stop-color:#4fb3a9;stop-opacity:0.05"/>'+
        '</linearGradient>'+
        '</defs>'+
        '<text x="10" y="20" font-size="12" fill="#5c6a7a">walks ('+scale+')</text>';

      // Draw area
      let areaPath='M 50 '+(chartH-30);
      for(let i=0;i<buckets.length;i++){
        const h=Math.round(buckets[i].count/maxCount*200);
        const x=50+i*barW+Math.floor(barW/2);
        const y=chartH-30-h;
        areaPath+=' L '+x+' '+y;
      }
      areaPath+=' L '+(50+buckets.length*barW)+' '+(chartH-30)+' Z';
      svgHtml+='<path d="'+areaPath+'" fill="url(#tideFill)" stroke="#4fb3a9" stroke-width="1.5"/>';

      // Median line
      const medianY=chartH-30-Math.round(median/maxCount*200);
      svgHtml+='<line x1="40" y1="'+medianY+'" x2="'+(chartW-10)+'" y2="'+medianY+'" stroke="#5c6a7a" stroke-width="1" stroke-dasharray="3,3"/>';
      svgHtml+='<text x="'+(chartW-30)+'" y="'+(medianY-5)+'" font-size="10" fill="#5c6a7a">median</text>';

      // Alarm threshold line
      const thresholdY=chartH-30-Math.round(alarm_threshold/maxCount*200);
      svgHtml+='<line x1="40" y1="'+thresholdY+'" x2="'+(chartW-10)+'" y2="'+thresholdY+'" stroke="#c95d5d" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>';
      svgHtml+='<text x="'+(chartW-30)+'" y="'+(thresholdY+12)+'" font-size="10" fill="#c95d5d">alarm</text>';

      // Axes
      svgHtml+='<line x1="40" y1="'+(chartH-30)+'" x2="'+(chartW-10)+'" y2="'+(chartH-30)+'" stroke="#1c242e" stroke-width="1"/>';
      svgHtml+='<text x="10" y="'+(chartH-10)+'" font-size="11" fill="#5c6a7a">0</text>';
      svgHtml+='<text x="10" y="25" font-size="11" fill="#5c6a7a">'+maxCount+'</text>';

      svgHtml+='</svg>';
      html+='<section><h2>Activity ('+scale+')</h2>'+
        '<div class="chart">'+svgHtml+'</div></section>';
    }

    // Alarm buckets table
    if(alarm_buckets.length>0){
      html+='<section><h2>Storm Surge Events</h2>'+
        '<table><thead><tr><th>Bucket</th><th style="text-align:right">Walk Count</th><th style="text-align:right">Threshold</th></tr></thead><tbody>';
      for(const b of alarm_buckets){
        html+='<tr>'+
          '<td class="bucket">'+esc(b.bucket)+'</td>'+
          '<td class="count">'+b.count+'</td>'+
          '<td class="count">'+data.alarm_threshold+'</td>'+
          '</tr>';
      }
      html+='</tbody></table></section>';
    }

    $content.innerHTML=html;
  }

  document.querySelectorAll('.scale-btn').forEach(btn=>{
    btn.addEventListener('click',()=>loadTide(btn.dataset.scale));
  });

  loadTide('24h');
})();
</script>
</body>
</html>
